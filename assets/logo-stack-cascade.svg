<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32" fill="none">
  <title>protodeck</title>
  <!-- Golden ratio stack (φ ≈ 1.618): every width, height and offset is a term of 100/φⁿ; corner radius = short side / φ³. -->
  <defs>
    <mask id="pd-m0" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="64.67" y="31.87" width="29.33" height="47.46" rx="6.92" fill="#000" stroke="#000" stroke-width="7"/>
      <rect x="46.54" y="68.13" width="29.33" height="18.13" rx="4.28" fill="#000" stroke="#000" stroke-width="7"/>
    </mask>
    <mask id="pd-m1" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="46.54" y="68.13" width="29.33" height="18.13" rx="4.28" fill="#000" stroke="#000" stroke-width="7"/>
    </mask>
  </defs>
  <rect x="6" y="13.74" width="76.8" height="47.46" rx="11.2" fill="currentColor" fill-opacity="0.32" mask="url(#pd-m0)"/>
  <rect x="64.67" y="31.87" width="29.33" height="47.46" rx="6.92" fill="currentColor" mask="url(#pd-m1)"/>
  <rect x="46.54" y="68.13" width="29.33" height="18.13" rx="4.28" fill="var(--accent, #6366f1)"/>
</svg>
