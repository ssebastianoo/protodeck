<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32" fill="none">
  <title>protodeck</title>
  <!-- Golden ratio stack (φ ≈ 1.618): every width, height and offset is a term of 100/φⁿ; corner radius = short side / φ³. -->
  <defs>
    <mask id="pd-m0" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="60.39" y="39.61" width="33.61" height="54.39" rx="7.93" fill="#000" stroke="#000" stroke-width="7"/>
      <rect x="39.61" y="52.45" width="33.61" height="20.77" rx="4.9" fill="#000" stroke="#000" stroke-width="7"/>
    </mask>
    <mask id="pd-m1" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="39.61" y="52.45" width="33.61" height="20.77" rx="4.9" fill="#000" stroke="#000" stroke-width="7"/>
    </mask>
  </defs>
  <rect x="6" y="6" width="88" height="54.39" rx="12.84" fill="currentColor" fill-opacity="0.32" mask="url(#pd-m0)"/>
  <rect x="60.39" y="39.61" width="33.61" height="54.39" rx="7.93" fill="currentColor" mask="url(#pd-m1)"/>
  <rect x="39.61" y="52.45" width="33.61" height="20.77" rx="4.9" fill="var(--accent, #6366f1)"/>
</svg>
