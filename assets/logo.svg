<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128" fill="none">
  <title>protodeck</title>
  <!-- Golden ratio stack (φ ≈ 1.618): every size and offset is a term of 100/φⁿ; corner radius = short side / φ³. -->
  <style>.pd-back{fill:#18181b;fill-opacity:.32}.pd-mid{fill:#18181b}.pd-front{fill:#6366f1}@media (prefers-color-scheme:dark){.pd-back{fill:#f4f4f5}.pd-mid{fill:#f4f4f5}.pd-front{fill:#818cf8}}</style>
  <defs>
    <mask id="pd-m0" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="6" y="39.61" width="33.61" height="54.39" rx="7.93" fill="#000" stroke="#000" stroke-width="7"/>
      <rect x="33.19" y="39.61" width="33.61" height="20.77" rx="4.9" fill="#000" stroke="#000" stroke-width="7"/>
    </mask>
    <mask id="pd-m1" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="33.19" y="39.61" width="33.61" height="20.77" rx="4.9" fill="#000" stroke="#000" stroke-width="7"/>
    </mask>
  </defs>
  <rect x="6" y="6" width="88" height="54.39" rx="12.84" class="pd-back" mask="url(#pd-m0)"/>
  <rect x="6" y="39.61" width="33.61" height="54.39" rx="7.93" class="pd-mid" mask="url(#pd-m1)"/>
  <rect x="33.19" y="39.61" width="33.61" height="20.77" rx="4.9" class="pd-front"/>
</svg>
