<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>protodeck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 fill=%22none%22%3E%3Cstyle%3E.pd-back%7Bfill:%2318181b;fill-opacity:.32%7D.pd-mid%7Bfill:%2318181b%7D.pd-front%7Bfill:%236366f1%7D%40media %28prefers-color-scheme:dark%29%7B.pd-back%7Bfill:%23f4f4f5%7D.pd-mid%7Bfill:%23f4f4f5%7D.pd-front%7Bfill:%23818cf8%7D%7D%3C/style%3E%3Cdefs%3E%3Cmask id=%22m0%22 maskUnits=%22userSpaceOnUse%22 x=%220%22 y=%220%22 width=%22100%22 height=%22100%22%3E %3Crect width=%22100%22 height=%22100%22 fill=%22%23fff%22/%3E %3Crect x=%226%22 y=%2239.61%22 width=%2233.61%22 height=%2254.39%22 rx=%227.93%22 fill=%22%23000%22 stroke=%22%23000%22 stroke-width=%227%22/%3E %3Crect x=%2233.19%22 y=%2239.61%22 width=%2233.61%22 height=%2220.77%22 rx=%224.9%22 fill=%22%23000%22 stroke=%22%23000%22 stroke-width=%227%22/%3E %3C/mask%3E %3Cmask id=%22m1%22 maskUnits=%22userSpaceOnUse%22 x=%220%22 y=%220%22 width=%22100%22 height=%22100%22%3E %3Crect width=%22100%22 height=%22100%22 fill=%22%23fff%22/%3E %3Crect x=%2233.19%22 y=%2239.61%22 width=%2233.61%22 height=%2220.77%22 rx=%224.9%22 fill=%22%23000%22 stroke=%22%23000%22 stroke-width=%227%22/%3E %3C/mask%3E%3C/defs%3E%3Crect x=%226%22 y=%226%22 width=%2288%22 height=%2254.39%22 rx=%2212.84%22 class=%22pd-back%22 mask=%22url%28%23m0%29%22/%3E%3Crect x=%226%22 y=%2239.61%22 width=%2233.61%22 height=%2254.39%22 rx=%227.93%22 class=%22pd-mid%22 mask=%22url%28%23m1%29%22/%3E%3Crect x=%2233.19%22 y=%2239.61%22 width=%2233.61%22 height=%2220.77%22 rx=%224.9%22 class=%22pd-front%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/__protodeck/base.css?v=%VERSION%">
<link rel="stylesheet" href="/__protodeck/gallery.css?v=%VERSION%">
<script>window.__protodeckGallery = %BOOT%;
(function () {
  var t = null;
  try { t = JSON.parse(localStorage.getItem("protodeck:theme")); } catch (e) {}
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
  window.__protodeckTheme = t;
})();</script>
<script src="/__protodeck/gallery.js?v=%VERSION%" defer></script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 100 100" width="20" height="20" aria-hidden="true"><defs><mask id="pd-logo-m0" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"> <rect width="100" height="100" fill="#fff"/> <rect x="6" y="39.61" width="33.61" height="54.39" rx="7.93" fill="#000" stroke="#000" stroke-width="7"/> <rect x="33.19" y="39.61" width="33.61" height="20.77" rx="4.9" fill="#000" stroke="#000" stroke-width="7"/> </mask> <mask id="pd-logo-m1" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"> <rect width="100" height="100" fill="#fff"/> <rect x="33.19" y="39.61" width="33.61" height="20.77" rx="4.9" fill="#000" stroke="#000" stroke-width="7"/> </mask></defs><rect x="6" y="6" width="88" height="54.39" rx="12.84" fill="currentColor" fill-opacity="0.32" mask="url(#pd-logo-m0)"/><rect x="6" y="39.61" width="33.61" height="54.39" rx="7.93" fill="currentColor" mask="url(#pd-logo-m1)"/><rect x="33.19" y="39.61" width="33.61" height="20.77" rx="4.9" fill="var(--accent, #6366f1)"/></svg>
    <span>protodeck</span>
    <span class="muted" id="summary"></span>
  </div>
  <div class="pickers">
    <div class="picker">
      <button type="button" class="picker-btn" id="routesBtn" aria-haspopup="true" aria-expanded="false" aria-controls="routesMenu"><span class="muted">Routes</span><span class="picker-val" id="routesLabel"></span><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="picker-menu" id="routesMenu" role="menu" aria-label="Routes" hidden></div>
    </div>
    <div class="picker">
      <button type="button" class="picker-btn" id="devicesBtn" aria-haspopup="true" aria-expanded="false" aria-controls="devicesMenu"><span class="muted">Devices</span><span class="picker-val" id="devicesLabel"></span><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="picker-menu" id="devicesMenu" role="menu" aria-label="Devices" hidden></div>
    </div>
  </div>
  <div class="tools">
    <label class="zoom" title="Zoom: pinch, Ctrl/⌘ + scroll, or ⌘ +/−/0. Pan: scroll, drag the background, or hold Space and drag.">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M7 2a5 5 0 1 0 3.1 8.9l3.5 3.5 1-1-3.5-3.5A5 5 0 0 0 7 2Zm0 1.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z" fill="currentColor"/></svg>
      <input type="range" id="zoom" min="160" max="1600" step="10" value="560" aria-label="Frame size">
    </label>
    <div class="picker">
      <button type="button" class="picker-btn" id="settingsBtn" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu" title="View settings"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 4.5h6m3 0h2M2.5 11.5h2m3 0h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>View</span></button>
      <div class="picker-menu picker-menu-end" id="settingsMenu" role="menu" aria-label="View settings" hidden></div>
    </div>
    <button type="button" class="icon-btn icon-sm theme-btn" id="themeBtn" aria-label="Switch theme">
      <svg class="sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg class="moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.5 9.6A5.5 5.5 0 0 1 6.4 2.5a5.5 5.5 0 1 0 7.1 7.1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main id="canvas" class="canvas" tabindex="-1">
  <div class="stage" id="stage">
  <div id="screens"></div>
  <section id="componentsSection" class="components" hidden>
    <h2>Components</h2>
    <div id="components" class="component-grid"></div>
  </section>
  <div id="empty" class="empty" hidden>
    <p class="empty-title">No screens yet</p>
    <p>Create <code id="emptyPath">protodeck/home/index.html</code> and it shows up here.</p>
  </div>
  </div>
</main>

<div class="dock" id="dock">
  <div class="log" id="log" hidden></div>
  <form class="composer" id="composer">
    <div class="ctx" id="ctx">
      <button type="button" class="chip" id="targetChip" title="Screen and device the instruction refers to. Click a frame to change it."></button>
      <span class="chip chip-el" id="elementChip" hidden><span id="elementLabel"></span><button type="button" id="clearElement" aria-label="Clear selected element">×</button></span>
      <span class="spacer"></span>
      <span class="status" id="status" hidden></span>
      <button type="button" class="link" id="toggleLog" hidden>History</button>
      <button type="button" class="model-btn" id="modelBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="modelMenu" title="Choose agent, model and reasoning">
        <span class="mark" id="modelMark" aria-hidden="true"></span>
        <span class="model-label" id="modelLabel"></span>
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="icon-btn icon-sm" id="newChat" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="row">
      <button type="button" class="icon-btn" id="pick" title="Select an element (Esc to cancel)" aria-pressed="false">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 3h5v1.5H4.5V8H3V3Zm9 0h5v5h-1.5V4.5H12V3ZM3 12h1.5v3.5H8V17H3v-5Zm7.2-1.8 7 2.6-3 1.2 2.6 2.6-1.1 1.1-2.6-2.6-1.2 3-2.7-7.9Z" fill="currentColor"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Describe a change… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button type="submit" class="send" id="send" aria-label="Send">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 3.5 16 9.5l-1.1 1.1-4.1-4.1V16.5H9.2V6.5L5.1 10.6 4 9.5l6-6Z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="stop" id="stop" aria-label="Stop" hidden>
        <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor"/></svg>
      </button>
    </div>
  </form>
</div>

<div class="model-menu" id="modelMenu" role="dialog" aria-label="Agent and model" hidden>
  <nav class="menu-rail" id="agentRail" aria-label="Agents"></nav>
  <div class="menu-models">
    <label class="menu-search">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M7 2a5 5 0 1 0 3.1 8.9l3.5 3.5 1-1-3.5-3.5A5 5 0 0 0 7 2Zm0 1.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z" fill="currentColor"/></svg>
      <input id="modelSearch" type="text" placeholder="Search models…" autocomplete="off" spellcheck="false" aria-label="Search models">
    </label>
    <div class="menu-list" id="modelList" role="listbox" aria-label="Models"></div>
  </div>
  <div class="menu-effort">
    <div class="menu-head"><span>Reasoning</span><span class="muted" id="effortFor"></span></div>
    <div class="menu-list" id="effortList" role="listbox" aria-label="Reasoning level"></div>
  </div>
</div>
</body>
</html>
