<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>protodeck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='18' height='20' rx='4' fill='%2318181b'/%3E%3Crect x='11' y='3' width='18' height='20' rx='4' fill='%236366f1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/__protodeck/base.css?v=%VERSION%">
<link rel="stylesheet" href="/__protodeck/gallery.css?v=%VERSION%">
<script>window.__protodeckGallery = %BOOT%;</script>
<script src="/__protodeck/gallery.js?v=%VERSION%" defer></script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><rect x="3" y="6" width="18" height="20" rx="4" fill="currentColor"/><rect x="11" y="3" width="18" height="20" rx="4" fill="var(--accent)"/></svg>
    <span>protodeck</span>
    <span class="muted" id="summary"></span>
  </div>
  <div class="pickers">
    <div class="picker">
      <button type="button" class="picker-btn" id="routesBtn" aria-haspopup="true" aria-expanded="false" aria-controls="routesMenu"><span class="muted">Routes</span><span class="picker-val" id="routesLabel"></span><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="picker-menu" id="routesMenu" role="menu" aria-label="Routes" hidden></div>
    </div>
    <div class="picker">
      <button type="button" class="picker-btn" id="devicesBtn" aria-haspopup="true" aria-expanded="false" aria-controls="devicesMenu"><span class="muted">Devices</span><span class="picker-val" id="devicesLabel"></span><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="picker-menu" id="devicesMenu" role="menu" aria-label="Devices" hidden></div>
    </div>
  </div>
  <div class="tools">
    <label class="zoom" title="Frame size">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M7 2a5 5 0 1 0 3.1 8.9l3.5 3.5 1-1-3.5-3.5A5 5 0 0 0 7 2Zm0 1.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z" fill="currentColor"/></svg>
      <input type="range" id="zoom" min="260" max="960" step="20" value="560" aria-label="Frame size">
    </label>
    <button class="btn" id="scaleMode" title="Toggle between same height and true relative size">Same height</button>
  </div>
</header>

<main id="canvas" class="canvas">
  <div id="screens"></div>
  <section id="componentsSection" class="components" hidden>
    <h2>Components</h2>
    <div id="components" class="component-grid"></div>
  </section>
  <div id="empty" class="empty" hidden>
    <p class="empty-title">No screens yet</p>
    <p>Create <code id="emptyPath">protodeck/home/index.html</code> and it shows up here.</p>
  </div>
</main>

<div class="dock" id="dock">
  <div class="log" id="log" hidden></div>
  <form class="composer" id="composer">
    <div class="ctx" id="ctx">
      <button type="button" class="chip" id="targetChip" title="Screen and device the instruction refers to. Click a frame to change it."></button>
      <span class="chip chip-el" id="elementChip" hidden><span id="elementLabel"></span><button type="button" id="clearElement" aria-label="Clear selected element">×</button></span>
      <span class="spacer"></span>
      <span class="status" id="status" hidden></span>
      <button type="button" class="link" id="toggleLog" hidden>History</button>
      <button type="button" class="model-btn" id="modelBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="modelMenu" title="Choose agent, model and reasoning">
        <span class="mark" id="modelMark" aria-hidden="true"></span>
        <span class="model-label" id="modelLabel"></span>
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="icon-btn icon-sm" id="newChat" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="row">
      <button type="button" class="icon-btn" id="pick" title="Select an element (Esc to cancel)" aria-pressed="false">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 3h5v1.5H4.5V8H3V3Zm9 0h5v5h-1.5V4.5H12V3ZM3 12h1.5v3.5H8V17H3v-5Zm7.2-1.8 7 2.6-3 1.2 2.6 2.6-1.1 1.1-2.6-2.6-1.2 3-2.7-7.9Z" fill="currentColor"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Describe a change… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button type="submit" class="send" id="send" aria-label="Send">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 3.5 16 9.5l-1.1 1.1-4.1-4.1V16.5H9.2V6.5L5.1 10.6 4 9.5l6-6Z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="stop" id="stop" aria-label="Stop" hidden>
        <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor"/></svg>
      </button>
    </div>
  </form>
</div>

<div class="model-menu" id="modelMenu" role="dialog" aria-label="Agent and model" hidden>
  <nav class="menu-rail" id="agentRail" aria-label="Agents"></nav>
  <div class="menu-models">
    <label class="menu-search">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M7 2a5 5 0 1 0 3.1 8.9l3.5 3.5 1-1-3.5-3.5A5 5 0 0 0 7 2Zm0 1.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z" fill="currentColor"/></svg>
      <input id="modelSearch" type="text" placeholder="Search models…" autocomplete="off" spellcheck="false" aria-label="Search models">
    </label>
    <div class="menu-list" id="modelList" role="listbox" aria-label="Models"></div>
  </div>
  <div class="menu-effort">
    <div class="menu-head"><span>Reasoning</span><span class="muted" id="effortFor"></span></div>
    <div class="menu-list" id="effortList" role="listbox" aria-label="Reasoning level"></div>
  </div>
</div>
</body>
</html>
